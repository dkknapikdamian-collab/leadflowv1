name: G15-R4 DELETE cross-consumer readiness

on:
  push:
    branches:
      - g15-r4-delete-cross-consumer-readiness
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/guards/verify-lf-prod-sot-g15-r4-delete-cross-consumer-automated-readiness-gate.cjs
      - run: node --test tests/lf-prod-sot-g15-r4-delete-cross-consumer-automated-readiness-gate.test.cjs
