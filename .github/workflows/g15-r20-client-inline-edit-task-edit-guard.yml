name: G15-R20 client inline edit and task edit guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r20:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Focused G15-R20 tests
        run: node --test tests/lf-prod-sot-g15-r20-client-inline-edit-task-edit-guard.test.cjs
      - name: Reconciled client inline edit and task edit guard
        run: node scripts/check-client-inline-edit-and-task-edit.cjs
      - name: Production build
        run: npm run build
