name: G15-R15 Stage06 ClientDetail guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r15:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Focused G15-R15 tests
        run: node --test tests/lf-prod-sot-g15-r15-stage06-client-detail-guard.test.cjs
      - name: Reconciled Stage06 ClientDetail guard
        run: node scripts/check-visual-stage06-client-detail.cjs
      - name: Production build
        run: npm run build
