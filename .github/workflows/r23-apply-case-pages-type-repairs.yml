name: R23 apply CaseDetail type repairs

on:
  pull_request:
    branches:
      - dev-rollout-freeze
    paths:
      - .github/workflows/r23-apply-case-pages-type-repairs.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'g15-r23-scope-tsc-to-active-product'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R23 branch
        uses: actions/checkout@v4
        with:
          ref: g15-r23-scope-tsc-to-active-product
          fetch-depth: 0
      - name: Remove dead loading-state delete dialog
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('src/pages/CaseDetail.tsx')
          text = path.read_text(encoding='utf-8-sig')
          pattern = r'(</main>)\s*<ConfirmDialog[\s\S]*?data-case-detail-delete-confirm="true"[\s\S]*?/>\s*(</Layout>)'
          next_text, count = re.subn(pattern, r'\1\n    \2', text, count=1)
          print('matches', count)
          if count != 1: raise SystemExit(f'expected 1 loading dialog match, found {count}')
          path.write_text(next_text, encoding='utf-8')
      - name: Repair CaseDetail task preview identifier
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/CaseDetail.tsx')
          text = path.read_text(encoding='utf-8-sig')
          old = 'getTaskNoteFollowUpPreviewStage231H_R1D2_R11(taskWithMissingBridgeStage232O)'
          count = text.count(old)
          print('matches', count)
          if count != 1: raise SystemExit(f'expected 1 task preview match, found {count}')
          path.write_text(text.replace(old, 'getTaskNoteFollowUpPreviewStage231H_R1D2_R11(task)', 1), encoding='utf-8')
      - name: Extend CaseItemInput payload contract
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('src/lib/supabase-fallback.ts')
          text = path.read_text(encoding='utf-8-sig')
          pattern = r'(type CaseItemInput = \{[\s\S]*?approvedAt\?: string \| null;)(\s*\};)'
          next_text, count = re.subn(pattern, r'\1\n  payload?: Record<string, unknown>;\2', text, count=1)
          print('matches', count)
          if count != 1: raise SystemExit(f'expected 1 CaseItemInput match, found {count}')
          path.write_text(next_text, encoding='utf-8')
      - name: Validate CaseDetail repairs
        run: |
          git diff --check
          npm ci
          npm install --no-save --package-lock=false @types/react@19.2.17 @types/react-dom@19.2.3
          node scripts/check-g15-r23-tsc-active-product-scope.cjs
          npx tsc --noEmit --pretty false > r23-case-detail-tsc.log 2>&1 || true
          npm run build
          cat r23-case-detail-tsc.log
      - name: Commit and self-remove workflow
        run: |
          rm .github/workflows/r23-apply-case-pages-type-repairs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CaseDetail.tsx src/lib/supabase-fallback.ts .github/workflows/r23-apply-case-pages-type-repairs.yml
          git commit -m "fix(closeflow): repair CaseDetail TypeScript adapters"
          git push origin HEAD:g15-r23-scope-tsc-to-active-product
