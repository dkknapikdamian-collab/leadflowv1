name: G15-R19 Stage01 shell guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r19:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Focused G15-R19 tests
        run: node --test tests/lf-prod-sot-g15-r19-stage01-shell-guard.test.cjs
      - name: Reconciled Stage01 shell guard
        run: node scripts/check-visual-stage01-shell.cjs
      - name: Production build
        run: npm run build
