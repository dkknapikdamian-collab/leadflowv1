name: CI

on:
  pull_request:
  push:
    branches:
      - dev-rollout-freeze
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: node scripts/run-lint-cross-platform.cjs

      - name: Build
        run: npm run build

      # The historical npm test runner contains retired stage contracts with a
      # registered failing baseline. The active release gate is the bounded
      # Forteca suite below; the historical baseline remains auditable locally
      # with npm test and is not represented as green here.
      - name: Test - Forteca current suite
        run: npm run test:forteca-current

      - name: Guard - Supabase first architecture
        run: npm run verify:architecture:supabase-first

      - name: Guard - Gemini client security
        run: npm run verify:security:gemini-client

      - name: Guard - Auth Supabase stage01
        run: npm run verify:auth:supabase-stage01

      - name: Guard - Quiet release gate
        run: npm run verify:closeflow:quiet

      - name: Guard - Mojibake
        run: npm run check:polish-mojibake

      - name: Guard - Supabase migrations
        run: npm run verify:migrations:supabase
