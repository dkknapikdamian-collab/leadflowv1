name: G15-R23D bootstrap exact patch

on:
  push:
    branches:
      - g15-r23d-context-action-case-source-narrowing-type-repair

permissions:
  contents: write

jobs:
  apply-r23d:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: g15-r23d-context-action-case-source-narrowing-type-repair

      - name: Apply exact R23D implementation and evidence files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/components/ContextActionDialogs.tsx')
          source = source_path.read_text(encoding='utf-8')
          old = "            source: request.recordType === 'client' ? 'STAGE232I2_CONTEXT_ACTION_CLIENT_MISSING_ITEM_SOURCE' : 'context_action_dialogs_blocker',"
          new = "            source: 'context_action_dialogs_blocker',"
          if source.count(old) != 1:
              raise SystemExit(f'EXPECTED_ONE_R23D_SOURCE_GOT_{source.count(old)}')
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          Path('scripts/check-g15-r23d-context-action-case-source-narrowing.cjs').write_text(r'''#!/usr/bin/env node
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const sourcePath = path.join(root, 'src/components/ContextActionDialogs.tsx');

          function fail(message) {
            console.error(`FAIL: ${message}`);
            process.exit(1);
          }

          if (!fs.existsSync(sourcePath)) fail('missing ContextActionDialogs.tsx');
          const source = fs.readFileSync(sourcePath, 'utf8');

          const impossible = "source: request.recordType === 'client' ? 'STAGE232I2_CONTEXT_ACTION_CLIENT_MISSING_ITEM_SOURCE' : 'context_action_dialogs_blocker',";
          if (source.includes(impossible)) fail('impossible case/client comparison remains');

          const caseStart = source.indexOf("if (request.recordType === 'case') {");
          const elseStart = source.indexOf('      } else {', caseStart);
          if (caseStart < 0 || elseStart < 0) fail('case branch boundaries missing');
          const caseBranch = source.slice(caseStart, elseStart);

          if (!caseBranch.includes("source: 'context_action_dialogs_blocker',")) {
            fail('case task payload must use the exact runtime-equivalent source literal');
          }
          if (caseBranch.includes("request.recordType === 'client'")) {
            fail('case branch still compares recordType with client');
          }
          if (!caseBranch.includes("source: 'STAGE232I1_CASE_DETAIL_MISSING_BLOCKER_RUNTIME',")) {
            fail('case activity source contract changed');
          }
          if (!source.includes("const clientId = request.clientId || (request.recordType === 'client' ? request.recordId : null);")) {
            fail('valid client narrowing outside the case branch changed');
          }
          if (!source.includes('item: createdMissingTaskRecordStage232N,')) fail('next TS2353 item debt was modified');
          if (!source.includes('record: createdMissingTaskRecordStage232N,')) fail('existing no-flicker record field changed');

          console.log('PASS: R23D removes only the impossible case/client source comparison and preserves runtime behavior.');
          ''', encoding='utf-8')

          Path('tests/lf-prod-sot-g15-r23d-context-action-case-source-narrowing.test.cjs').write_text(r'''const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const test = require('node:test');

          const root = path.resolve(__dirname, '..');
          const sourcePath = path.join(root, 'src/components/ContextActionDialogs.tsx');
          const guardPath = path.join(root, 'scripts/check-g15-r23d-context-action-case-source-narrowing.cjs');
          const source = fs.readFileSync(sourcePath, 'utf8');

          test('R23D focused guard passes', () => {
            const result = spawnSync(process.execPath, [guardPath], { cwd: root, encoding: 'utf8' });
            assert.equal(result.status, 0, `${result.stdout}\n${result.stderr}`);
            assert.match(result.stdout, /PASS: R23D/);
          });

          test('case branch uses the runtime-equivalent fixed source literal', () => {
            const caseStart = source.indexOf("if (request.recordType === 'case') {");
            const elseStart = source.indexOf('      } else {', caseStart);
            assert.ok(caseStart >= 0 && elseStart > caseStart);
            const caseBranch = source.slice(caseStart, elseStart);
            assert.match(caseBranch, /source: 'context_action_dialogs_blocker',/);
            assert.doesNotMatch(caseBranch, /request\.recordType === 'client'/);
          });

          test('valid client narrowing outside the case branch remains', () => {
            assert.match(source, /const clientId = request\.clientId \|\| \(request\.recordType === 'client' \? request\.recordId : null\);/);
          });

          test('R23D leaves the next no-flicker mutation type debt untouched', () => {
            assert.match(source, /item: createdMissingTaskRecordStage232N,/);
            assert.match(source, /record: createdMissingTaskRecordStage232N,/);
          });
          ''', encoding='utf-8')

          Path('.github/workflows/g15-r23d-context-action-case-source-narrowing.yml').write_text(r'''name: G15-R23D context-action case source narrowing type repair

          on:
            pull_request:
              branches:
                - dev-rollout-freeze
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify-g15-r23d:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Use Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install locked dependencies
                  run: npm ci

                - name: Install diagnostic React 19 type foundation
                  run: npm install --no-save --package-lock=false @types/react@19.2.17 @types/react-dom@19.2.3

                - name: Prove dependency manifests unchanged
                  run: git diff --exit-code "origin/${GITHUB_BASE_REF}...HEAD" -- package.json package-lock.json

                - name: Focused R23D tests
                  run: node --test tests/lf-prod-sot-g15-r23d-context-action-case-source-narrowing.test.cjs

                - name: R23D case source narrowing guard
                  run: node scripts/check-g15-r23d-context-action-case-source-narrowing.cjs

                - name: R23A active TypeScript scope guard
                  run: node scripts/check-g15-r23a-tsc-active-scope.cjs

                - name: Map active TypeScript debt after R23D
                  run: node scripts/diagnostics/map-g15-r23a-active-tsc-debt.cjs

                - name: Verify exact R23D debt delta
                  run: |
                    node - <<'NODE'
                    const fs = require('node:fs');
                    const summary = JSON.parse(fs.readFileSync('_project/artifacts/g15-r23a-active-tsc/summary.json', 'utf8'));
                    const expectedFirstError = {
                      file: 'src/components/ContextActionDialogs.tsx',
                      line: 419,
                      column: 11,
                      code: 'TS2353',
                    };
                    if (summary.status !== 'ACTIVE_TYPE_DEBT_IDENTIFIED') throw new Error(`UNEXPECTED_STATUS=${summary.status}`);
                    if (summary.errorCount !== 62) throw new Error(`EXPECTED_62_ACTIVE_ERRORS_GOT_${summary.errorCount}`);
                    if (summary.globalErrorCount !== 0) throw new Error(`GLOBAL_ERRORS=${summary.globalErrorCount}`);
                    if (summary.nonActiveErrorCount !== 0) throw new Error(`NON_ACTIVE_ERRORS=${summary.nonActiveErrorCount}`);
                    for (const [key, value] of Object.entries(expectedFirstError)) {
                      if (summary.firstError?.[key] !== value) {
                        throw new Error(`UNEXPECTED_FIRST_ERROR_${key}=${summary.firstError?.[key]}`);
                      }
                    }
                    console.log(JSON.stringify(summary, null, 2));
                    NODE

                - name: Verify exact changed-file allowlist
                  run: |
                    set -euo pipefail
                    git diff --check
                    git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | sort > /tmp/actual.txt
                    cat > /tmp/expected.txt <<'EOF'
                    .github/workflows/g15-r23d-context-action-case-source-narrowing.yml
                    _project/runs/LF-PROD-SOT-G15-R23D_CONTEXT_ACTION_CASE_SOURCE_NARROWING_TYPE_REPAIR.md
                    scripts/check-g15-r23d-context-action-case-source-narrowing.cjs
                    src/components/ContextActionDialogs.tsx
                    tests/lf-prod-sot-g15-r23d-context-action-case-source-narrowing.test.cjs
                    EOF
                    sort -o /tmp/expected.txt /tmp/expected.txt
                    diff -u /tmp/expected.txt /tmp/actual.txt

                - name: Upload R23D TypeScript debt delta evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: g15-r23d-active-tsc-debt-delta
                    path: _project/artifacts/g15-r23a-active-tsc/
                    if-no-files-found: error
                    retention-days: 30

                - name: Production build
                  run: npm run build
          ''', encoding='utf-8')

          Path('_project/runs/LF-PROD-SOT-G15-R23D_CONTEXT_ACTION_CASE_SOURCE_NARROWING_TYPE_REPAIR.md').write_text(r'''# LF-PROD-SOT-G15-R23D — Context-action case source narrowing type repair

          TIMESTAMP:
          2026-07-21 Europe/Warsaw

          STATUS:
          IMPLEMENTED_AWAITING_PR_CI_AND_EXACT_SHA_DEPLOY

          PROJECT_ID:
          closeflow_lead_app

          APP_INPUT_HEAD:
          53fdaedbe74525422baeefbe18fb61ec6bc3c989

          STAGE_ID:
          LF-PROD-SOT-G15-R23D_CONTEXT_ACTION_CASE_SOURCE_NARROWING_TYPE_REPAIR

          ## Scope

          R23D repairs only the TS2367 error caused by comparing `request.recordType` with `client` inside a branch already narrowed to `case`.

          Exact runtime repair:

          ```ts
          source: 'context_action_dialogs_blocker',
          ```

          This is runtime-equivalent to the previous always-false ternary and does not change persistence or business behavior.

          Runtime file:

          - `src/components/ContextActionDialogs.tsx`.

          Verification-only files:

          - `tests/lf-prod-sot-g15-r23d-context-action-case-source-narrowing.test.cjs`;
          - `scripts/check-g15-r23d-context-action-case-source-narrowing.cjs`;
          - `.github/workflows/g15-r23d-context-action-case-source-narrowing.yml`;
          - this report.

          ## Preserved contracts

          - case task payload source remains `context_action_dialogs_blocker` at runtime;
          - case activity source remains `STAGE232I1_CASE_DETAIL_MISSING_BLOCKER_RUNTIME`;
          - valid client narrowing outside the case branch remains unchanged;
          - no-flicker `item` and `record` fields remain unchanged;
          - package and lockfile unchanged;
          - SQL and migrations unchanged;
          - Event DELETE and Task DELETE remain local-tombstone-only;
          - remote Google Calendar behavior unchanged;
          - manual Google Calendar smoke remains deferred by owner.

          ## Expected verification

          - focused R23D tests: PASS;
          - R23D guard: PASS;
          - R23A active scope guard: PASS;
          - active TypeScript debt: `63 -> 62`;
          - global errors: `0`;
          - non-active errors: `0`;
          - first error after R23D: `src/components/ContextActionDialogs.tsx(419,11) TS2353`;
          - exact changed-file allowlist: 5 files;
          - production build: PASS;
          - both exact-SHA Vercel deployments: SUCCESS.

          ## Result

          Evidence fields are pending until PR CI and exact-SHA deployments complete. Full lint must not be marked PASS while 62 active TypeScript errors remain.
          ''', encoding='utf-8')

          Path('.github/workflows/g15-r23d-bootstrap-apply.yml').unlink()
          PY

      - name: Commit exact R23D scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ContextActionDialogs.tsx
          git add tests/lf-prod-sot-g15-r23d-context-action-case-source-narrowing.test.cjs
          git add scripts/check-g15-r23d-context-action-case-source-narrowing.cjs
          git add .github/workflows/g15-r23d-context-action-case-source-narrowing.yml
          git add _project/runs/LF-PROD-SOT-G15-R23D_CONTEXT_ACTION_CASE_SOURCE_NARROWING_TYPE_REPAIR.md
          git add -u -- .github/workflows/g15-r23d-bootstrap-apply.yml
          git diff --cached --check
          git commit -m "fix(closeflow): repair R23D case source narrowing"
          git push origin HEAD:g15-r23d-context-action-case-source-narrowing-type-repair
