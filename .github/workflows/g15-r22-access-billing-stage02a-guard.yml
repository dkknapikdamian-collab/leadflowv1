name: G15-R22 access billing Stage02A guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Focused G15-R22 tests
        run: node --test tests/lf-prod-sot-g15-r22-access-billing-stage02a-guard.test.cjs
      - name: Reconciled Access Billing Stage02A guard
        run: node scripts/check-access-billing-source-of-truth-stage02a.cjs
      - name: Production build
        run: npm run build
