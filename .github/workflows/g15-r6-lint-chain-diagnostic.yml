name: G15-R6 lint-chain first-failure diagnostic

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify-first-nonzero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify diagnostic runner contract
        run: node --test tests/lf-prod-sot-g15-r6-lint-chain-diagnostic.test.cjs

      - name: Identify first nonzero lint command
        run: node scripts/diagnostics/run-lint-chain-first-failure.cjs

      - name: Print diagnostic summary
        if: always()
        run: cat _project/artifacts/g15-r6-lint-chain/summary.json

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g15-r6-lint-chain-first-failure
          path: _project/artifacts/g15-r6-lint-chain/
          if-no-files-found: error
          retention-days: 30
