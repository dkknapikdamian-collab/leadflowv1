name: G15-R18 Stage02 Today guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r18:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Focused G15-R18 tests
        run: node --test tests/lf-prod-sot-g15-r18-stage02-today-guard.test.cjs
      - name: Reconciled Stage02 Today guard
        run: node scripts/check-visual-stage02-today.cjs
      - name: Production build
        run: npm run build
