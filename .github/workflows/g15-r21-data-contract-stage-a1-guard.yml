name: G15-R21 data-contract Stage A1 guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r21:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Focused G15-R21 tests
        run: node --test tests/lf-prod-sot-g15-r21-data-contract-stage-a1-guard.test.cjs
      - name: Reconciled Stage A1 data-contract guard
        run: node scripts/check-data-contract-stage-a1.cjs
      - name: Production build
        run: npm run build
