name: R23 apply active type batch two

on:
  pull_request:
    branches:
      - dev-rollout-freeze
    paths:
      - .github/workflows/r23-apply-active-type-batch-two.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'g15-r23-scope-tsc-to-active-product'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R23 branch
        uses: actions/checkout@v4
        with:
          ref: g15-r23-scope-tsc-to-active-product
          fetch-depth: 0
      - name: Apply exact type repairs
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8-sig')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def once(path, old, new):
              text = read(path); count = text.count(old); print(f'{path}: {count} matches')
              if count != 1: raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:90]!r}')
              write(path, text.replace(old, new, 1))
          def count_replace(path, old, new, expected):
              text = read(path); count = text.count(old); print(f'{path}: {count} matches')
              if count != expected: raise SystemExit(f'{path}: expected {expected}, found {count}: {old[:90]!r}')
              write(path, text.replace(old, new))

          once('src/lib/closeflow-runtime-source-truth.ts', '/** @param {{ planId?: unknown, subscriptionStatus?: unknown }} input */\nexport function buildRuntimeAccessPlanTruth(input = {}) {', 'export function buildRuntimeAccessPlanTruth(input: { planId?: unknown; subscriptionStatus?: unknown } = {}) {')

          once('src/lib/finance/finance-types.ts', '  plannedAmount?: number;\n  paidCommissionAmount:', '  plannedAmount?: number;\n  dueAmount?: number;\n  refundedAmount?: number;\n  paidCommissionAmount:')

          source = read('src/lib/finance/case-finance-source.ts')
          source = source.replace('  commissionRemainingAmount: number;\n};', '  commissionRemainingAmount: number;\n  currency: FinanceCurrency;\n};', 1)
          source = source.replace('.reduce((sum, payment) => {', '.reduce<number>((sum, payment) => {', 1)
          source = source.replace('.reduce((sum, payment) => sum + paymentAmount(payment), 0),', '.reduce<number>((sum, payment) => sum + paymentAmount(payment), 0),', 1)
          source = source.replace('.reduce((sum, payment) => sum + paymentAmount(payment), 0),', '.reduce<number>((sum, payment) => sum + paymentAmount(payment), 0),', 1)
          source = source.replace('    commissionRemainingAmount: roundMoney(caseSummaries.reduce((sum, summary) => sum + summary.commissionRemainingAmount, 0)),\n  };', "    commissionRemainingAmount: roundMoney(caseSummaries.reduce((sum, summary) => sum + summary.commissionRemainingAmount, 0)),\n    currency: caseSummaries[0]?.currency || 'PLN',\n  };")
          if source.count('.reduce<number>') < 3: raise SystemExit('case-finance reduce<number> repairs incomplete')
          if "currency: caseSummaries[0]?.currency || 'PLN'" not in source: raise SystemExit('client finance currency repair missing')
          write('src/lib/finance/case-finance-source.ts', source)

          once('src/lib/missing-items/stage227c2-missing-item-modal-contract.ts', '  if (!result.ok) {', '  if (result.ok === false) {')
          once('src/pages/Tasks.tsx', "      caseId: '',\n      relationQuery: '',", "      caseId: '',\n      clientId: '',\n      relationQuery: '',")

          count_replace('src/pages/Today.tsx', 'const handleTodayPipelineShortcutClick = (event: MouseEvent) => {', 'const handleTodayPipelineShortcutClick = (event: globalThis.MouseEvent) => {', 1)
          count_replace('src/pages/Today.tsx', 'const handleTodayWeekCalendarShortcutClick = (event: MouseEvent) => {', 'const handleTodayWeekCalendarShortcutClick = (event: globalThis.MouseEvent) => {', 1)
          once('src/pages/TodayStable.tsx', 'const handleMetricTileClick = (event: MouseEvent) => {', 'const handleMetricTileClick = (event: globalThis.MouseEvent) => {')

          Path('.github/workflows/r23-apply-active-type-batch-two.yml').unlink()
      - name: Validate batch
        run: |
          git diff --check
          npm ci
          npm install --no-save --package-lock=false @types/react@19.2.17 @types/react-dom@19.2.3
          node scripts/check-g15-r23-tsc-active-product-scope.cjs
          npx tsc --noEmit --pretty false > r23-batch-two-tsc.log 2>&1 || true
          npm run build
          cat r23-batch-two-tsc.log
      - name: Commit batch and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/closeflow-runtime-source-truth.ts src/lib/finance/finance-types.ts src/lib/finance/case-finance-source.ts src/lib/missing-items/stage227c2-missing-item-modal-contract.ts src/pages/Tasks.tsx src/pages/Today.tsx src/pages/TodayStable.tsx .github/workflows/r23-apply-active-type-batch-two.yml
          git commit -m "fix(closeflow): apply second active TypeScript repair batch"
          git push origin HEAD:g15-r23-scope-tsc-to-active-product
