name: G15-R9 A13 Templates light guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r9:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused G15-R9 tests
        run: node --test tests/lf-prod-sot-g15-r9-a13-templates-light-guard.test.cjs

      - name: A13 critical regressions guard
        run: node scripts/check-a13-critical-regressions.cjs

      - name: Production build
        run: npm run build
