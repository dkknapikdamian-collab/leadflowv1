name: G12 Atomic Create Sync State

on:
  push:
    branches:
      - dev-rollout-freeze
    paths:
      - .github/workflows/g12-atomic-create-sync-state.yml

permissions:
  contents: write

concurrency:
  group: g12-atomic-create-sync-state
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-rollout-freeze
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "11ed456e836c9eff36181666a9eb3f0c1a5ad4c8"
          git diff --quiet 11ed456e836c9eff36181666a9eb3f0c1a5ad4c8 -- src/lib/google-calendar-mutation-sync-state-decision.ts src/server/task-route-stage124f.ts src/server/event-route-stage124f.ts
      - name: Generate G12 files
        shell: python
        run: |
          from pathlib import Path
          import re

          helper = '''import {
            decideGoogleCalendarMutationSyncState,
            type GoogleCalendarMutationSyncStateDecision,
            type GoogleCalendarMutationSyncStateInput,
          } from './google-calendar-mutation-sync-state-decision.js';

          export type GoogleCalendarCreateSyncStateDecisionFields =
            Omit<GoogleCalendarMutationSyncStateInput, 'mutationKind'>;

          export type GoogleCalendarCreateSyncStateInsertPayload =
            Readonly<Record<string, never>>
            | Readonly<{ google_calendar_sync_status: 'pending' }>;

          export interface GoogleCalendarCreateSyncStateInsertPayloadResult {
            decision: GoogleCalendarMutationSyncStateDecision;
            insertPayload: GoogleCalendarCreateSyncStateInsertPayload;
          }

          export interface GoogleCalendarCreateSyncStateInsertPayloadDependencies {
            decide: (
              input: GoogleCalendarMutationSyncStateInput,
            ) => GoogleCalendarMutationSyncStateDecision;
          }

          const INVALID_DECISION = 'GCAL_CREATE_SYNC_STATE_INSERT_PAYLOAD_INVALID_DECISION';

          function isDecision(value: unknown): value is GoogleCalendarMutationSyncStateDecision {
            if (!value || typeof value !== 'object') return false;
            const decision = value as Partial<GoogleCalendarMutationSyncStateDecision>;
            return typeof decision.outcome === 'string'
              && (decision.nextSyncStatus === 'pending'
                || decision.nextSyncStatus === 'pending_delete'
                || decision.nextSyncStatus === null)
              && typeof decision.shouldWrite === 'boolean';
          }

          export function buildGoogleCalendarCreateSyncStateInsertPayloadWithDependencies(
            input: GoogleCalendarCreateSyncStateDecisionFields,
            dependencies: GoogleCalendarCreateSyncStateInsertPayloadDependencies,
          ): GoogleCalendarCreateSyncStateInsertPayloadResult {
            const decision = dependencies.decide({
              mutationKind: 'create',
              recordType: input.recordType,
              type: input.type,
              status: input.status,
              showInCalendar: input.showInCalendar,
              hasCalendarTime: input.hasCalendarTime,
              createdByUserId: input.createdByUserId,
              googleCalendarEventId: input.googleCalendarEventId,
              currentGoogleSyncStatus: input.currentGoogleSyncStatus,
            });

            if (!isDecision(decision)) throw new Error(INVALID_DECISION);

            if (
              decision.shouldWrite === true
              && decision.outcome === 'pending'
              && decision.nextSyncStatus === 'pending'
            ) {
              return {
                decision,
                insertPayload: { google_calendar_sync_status: 'pending' },
              };
            }

            if (decision.shouldWrite === false && decision.nextSyncStatus === null) {
              return { decision, insertPayload: {} };
            }

            throw new Error(INVALID_DECISION);
          }

          export function buildGoogleCalendarCreateSyncStateInsertPayload(
            input: GoogleCalendarCreateSyncStateDecisionFields,
          ): GoogleCalendarCreateSyncStateInsertPayloadResult {
            return buildGoogleCalendarCreateSyncStateInsertPayloadWithDependencies(input, {
              decide: decideGoogleCalendarMutationSyncState,
            });
          }
          '''
          Path('src/lib/google-calendar-create-sync-state-insert-payload.ts').write_text(helper, encoding='utf-8', newline='\n')

          tsconfig = '''{
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "allowJs": false,
              "noEmit": true
            },
            "include": [
              "src/lib/google-calendar-create-sync-state-insert-payload.ts",
              "src/lib/google-calendar-mutation-sync-state-decision.ts"
            ],
            "exclude": [
              "node_modules",
              "dist",
              "_project",
              "_local_backups",
              "backups",
              "bisect",
              "scripts",
              "tools"
            ]
          }
          '''
          Path('tsconfig.g12.json').write_text(tsconfig, encoding='utf-8', newline='\n')

          test = r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const ts = require('typescript');

          const root = path.resolve(__dirname, '..');
          const helperPath = path.join(root, 'src/lib/google-calendar-create-sync-state-insert-payload.ts');
          const decisionPath = path.join(root, 'src/lib/google-calendar-mutation-sync-state-decision.ts');
          const helperSource = fs.readFileSync(helperPath, 'utf8').replace(/\r\n/g, '\n');
          const decisionSource = fs.readFileSync(decisionPath, 'utf8').replace(/\r\n/g, '\n');
          const taskSource = fs.readFileSync(path.join(root, 'src/server/task-route-stage124f.ts'), 'utf8').replace(/\r\n/g, '\n');
          const eventSource = fs.readFileSync(path.join(root, 'src/server/event-route-stage124f.ts'), 'utf8').replace(/\r\n/g, '\n');

          const temp = fs.mkdtempSync(path.join(os.tmpdir(), 'g12-'));
          function compile(source, filename) {
            const output = ts.transpileModule(source, {
              compilerOptions: { module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022 },
              fileName: filename,
              reportDiagnostics: true,
            });
            assert.equal((output.diagnostics || []).length, 0);
            fs.writeFileSync(path.join(temp, filename), output.outputText, 'utf8');
          }
          compile(decisionSource, 'google-calendar-mutation-sync-state-decision.js');
          compile(helperSource, 'google-calendar-create-sync-state-insert-payload.js');
          const api = require(path.join(temp, 'google-calendar-create-sync-state-insert-payload.js'));

          function input(overrides = {}) {
            return {
              recordType: 'task', type: 'task', status: 'todo', showInCalendar: true,
              hasCalendarTime: true, createdByUserId: 'user-1', googleCalendarEventId: null,
              currentGoogleSyncStatus: null, ...overrides,
            };
          }

          test('01 imports real G7', () => assert.match(helperSource, /from '\.\/google-calendar-mutation-sync-state-decision\.js'/));
          test('02 no server imports', () => assert.equal(helperSource.includes('src/server'), false));
          test('03 hardcodes create', () => assert.match(helperSource, /mutationKind: 'create'/));
          for (const [i, field] of ['recordType','type','status','showInCalendar','hasCalendarTime','createdByUserId','googleCalendarEventId','currentGoogleSyncStatus'].entries()) {
            test(`${String(i + 4).padStart(2,'0')} maps ${field}`, () => assert.match(helperSource, new RegExp(`${field}: input\\.${field}`)));
          }
          test('12 visible task becomes pending', () => assert.deepEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input()).insertPayload, {google_calendar_sync_status:'pending'}));
          test('13 visible event becomes pending', () => assert.deepEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input({recordType:'event',type:'meeting'})).insertPayload, {google_calendar_sync_status:'pending'}));
          test('14 no owner skips', () => assert.deepEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input({createdByUserId:null})).insertPayload, {}));
          test('15 no time skips', () => assert.deepEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input({hasCalendarTime:false})).insertPayload, {}));
          test('16 hidden is unchanged', () => assert.deepEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input({showInCalendar:false})).insertPayload, {}));
          test('17 closed without event is unchanged', () => assert.deepEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input({status:'done'})).insertPayload, {}));
          test('18 imported skips', () => assert.deepEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input({type:'external_google_event'})).insertPayload, {}));
          test('19 unsupported record is unchanged', () => assert.deepEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input({recordType:'note'})).insertPayload, {}));
          test('20 already pending does not write', () => assert.deepEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input({currentGoogleSyncStatus:'pending'})).insertPayload, {}));
          test('21 pending payload has one key', () => assert.deepEqual(Object.keys(api.buildGoogleCalendarCreateSyncStateInsertPayload(input()).insertPayload), ['google_calendar_sync_status']));
          test('22 no-write has no sync key', () => assert.equal('google_calendar_sync_status' in api.buildGoogleCalendarCreateSyncStateInsertPayload(input({createdByUserId:null})).insertPayload, false));
          test('23 input is not mutated', () => { const value=input(); const before=structuredClone(value); api.buildGoogleCalendarCreateSyncStateInsertPayload(value); assert.deepEqual(value,before); });
          test('24 fresh output each call', () => assert.notEqual(api.buildGoogleCalendarCreateSyncStateInsertPayload(input()), api.buildGoogleCalendarCreateSyncStateInsertPayload(input())));
          const invalid = (decision) => api.buildGoogleCalendarCreateSyncStateInsertPayloadWithDependencies(input(), {decide:()=>decision});
          for (const [n, decision] of [
            [25,{outcome:'pending_delete',nextSyncStatus:'pending_delete',shouldWrite:true}],
            [26,{outcome:'pending',nextSyncStatus:null,shouldWrite:true}],
            [27,{outcome:'pending',nextSyncStatus:'pending',shouldWrite:false}],
            [28,{outcome:'unchanged',nextSyncStatus:'pending',shouldWrite:true}],
            [29,null],
          ]) test(`${n} invalid decision throws`, () => assert.throws(()=>invalid(decision), /GCAL_CREATE_SYNC_STATE_INSERT_PAYLOAD_INVALID_DECISION/));
          test('30 no fetch', () => assert.equal(/\bfetch\b/.test(helperSource), false));
          test('31 no Supabase', () => assert.equal(/supabase|insertWithVariants|updateById/i.test(helperSource), false));
          test('32 no G8', () => assert.equal(helperSource.includes('google-calendar-mutation-snapshot'), false));
          test('33 no G9', () => assert.equal(helperSource.includes('google-calendar-mutation-sync-state-marker'), false));
          test('34 task POST remains unwired', () => assert.equal(taskSource.includes('google-calendar-create-sync-state-insert-payload'), false));
          test('35 event POST remains unwired', () => assert.equal(eventSource.includes('google-calendar-create-sync-state-insert-payload'), false));
          test('36 task PATCH G9 call count one', () => assert.equal((taskSource.match(/markGoogleCalendarMutationSyncState\(/g)||[]).length, 1));
          test('37 event PATCH G9 call count one', () => assert.equal((eventSource.match(/markGoogleCalendarMutationSyncState\(/g)||[]).length, 1));
          test('38 output never contains pending_delete', () => assert.equal(JSON.stringify(api.buildGoogleCalendarCreateSyncStateInsertPayload(input())).includes('pending_delete'), false));
          test('39 decision is returned', () => assert.equal(api.buildGoogleCalendarCreateSyncStateInsertPayload(input()).decision.outcome, 'pending'));
          test('40 real G7 source unchanged semantics', () => assert.match(decisionSource, /mutationKind !== 'create' && mutationKind !== 'update'/));
          '''
          Path('tests/lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.test.cjs').write_text(test, encoding='utf-8', newline='\n')

          guard = r'''const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');
          const root = path.resolve(__dirname, '../..');
          const base = '11ed456e836c9eff36181666a9eb3f0c1a5ad4c8';
          const allowed = new Set([
            'src/lib/google-calendar-create-sync-state-insert-payload.ts',
            'scripts/guards/verify-lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.cjs',
            'tests/lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.test.cjs',
            '_project/runs/LF-PROD-SOT-G12_GCAL_CREATE_ATOMIC_SYNC_STATE_INSERT_PAYLOAD_CONTRACT.md',
            'tsconfig.g12.json',
            'package.json',
          ]);
          function run(command) { return cp.execSync(command,{cwd:root,encoding:'utf8'}).trim(); }
          function read(file) { return fs.readFileSync(path.join(root,file),'utf8').replace(/\r\n/g,'\n'); }
          const changed = run(`git diff --name-only ${base} --`).split(/\r?\n/).filter(Boolean);
          for (const file of changed) if (!allowed.has(file)) throw new Error(`G12_SCOPE_VIOLATION: ${file}`);
          for (const file of allowed) if (!fs.existsSync(path.join(root,file))) throw new Error(`G12_MISSING_FILE: ${file}`);
          const protectedPaths = [
            'src/lib/google-calendar-mutation-sync-state-decision.ts','src/server/google-calendar-mutation-snapshot.ts',
            'src/server/google-calendar-mutation-sync-state-marker.ts','src/server/task-route-stage124f.ts',
            'src/server/event-route-stage124f.ts','src/server/_supabase.ts','src/server/_request-scope.ts',
            'src/server/google-calendar-outbound.ts','src/server/google-calendar-inbound.ts','src/server/google-calendar-sync.ts',
            'tsconfig.json','package-lock.json'
          ];
          for (const file of protectedPaths) cp.execFileSync('git',['diff','--quiet',base,'--',file],{cwd:root});
          const helper=read('src/lib/google-calendar-create-sync-state-insert-payload.ts');
          const task=read('src/server/task-route-stage124f.ts');
          const event=read('src/server/event-route-stage124f.ts');
          if (!helper.includes("mutationKind: 'create'")) throw new Error('G12_CREATE_NOT_HARDCODED');
          if ((task.match(/markGoogleCalendarMutationSyncState\(/g)||[]).length!==1) throw new Error('TASK_PATCH_G9_CALL_COUNT');
          if ((event.match(/markGoogleCalendarMutationSyncState\(/g)||[]).length!==1) throw new Error('EVENT_PATCH_G9_CALL_COUNT');
          if (task.includes('google-calendar-create-sync-state-insert-payload')||event.includes('google-calendar-create-sync-state-insert-payload')) throw new Error('G12_RUNTIME_WIRED_TOO_EARLY');
          if (/fetch|supabaseRequest|insertWithVariants|updateByIdScoped|pending_delete.*insertPayload/.test(helper)) throw new Error('G12_FORBIDDEN_DEPENDENCY');
          const pkg=JSON.parse(read('package.json'));
          if (pkg.scripts['verify:lf-prod-sot-g12'] !== 'node scripts/guards/verify-lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.cjs && tsc --noEmit -p tsconfig.g12.json && node --test tests/lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.test.cjs') throw new Error('G12_PACKAGE_ALIAS');
          console.log('TASK_PATCH_G9_CALL_COUNT: 1');
          console.log('EVENT_PATCH_G9_CALL_COUNT: 1');
          console.log('TASK_POST_G12_IMPORT_COUNT: 0');
          console.log('EVENT_POST_G12_IMPORT_COUNT: 0');
          console.log('G12_FINAL_STATUS: PASS_GCAL_CREATE_ATOMIC_SYNC_STATE_INSERT_PAYLOAD_CONTRACT');
          '''
          Path('scripts/guards/verify-lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.cjs').write_text(guard, encoding='utf-8', newline='\n')

          report = '''# LF-PROD-SOT-G12 — GCAL CREATE atomic sync-state insert payload contract

          DATE_TIME: 2026-07-12 Europe/Warsaw
          STATUS: PASS_PENDING_FINAL_REMOTE_VERIFICATION
          APP_REPO: dkknapikdamian-collab/leadflowv1
          APP_BRANCH: dev-rollout-freeze
          APP_INPUT_HEAD_G12: 11ed456e836c9eff36181666a9eb3f0c1a5ad4c8
          G7_USED: YES
          MUTATION_KIND: create
          ATOMIC_INSERT_PAYLOAD_SUPPORTED: YES
          ALLOWED_WRITE: google_calendar_sync_status=pending
          PENDING_DELETE_ALLOWED: NO
          TASK_EVENT_ROUTES_CHANGED: NO
          POST_DELETE_WIRED: NO
          DB_GOOGLE_RUNTIME_CHANGED: NO
          TEST_TARGET: 40 PASS / 0 FAIL
          TSC_TARGET: PASS
          BUILD_TARGET: PASS
          G13_CREATED: NO

          Risk: G12 is intentionally pure and not connected to POST. A later independently approved stage must merge its payload into the same INSERT.
          '''
          Path('_project/runs/LF-PROD-SOT-G12_GCAL_CREATE_ATOMIC_SYNC_STATE_INSERT_PAYLOAD_CONTRACT.md').write_text(report, encoding='utf-8', newline='\n')

          package = Path('package.json')
          text = package.read_text(encoding='utf-8')
          alias = '    "verify:lf-prod-sot-g12": "node scripts/guards/verify-lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.cjs && tsc --noEmit -p tsconfig.g12.json && node --test tests/lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.test.cjs",\n'
          if '"verify:lf-prod-sot-g12"' in text:
              raise SystemExit('G12_ALIAS_ALREADY_EXISTS')
          match = re.search(r'(?m)^    "verify:lf-prod-sot-g11"[^\n]*\n', text)
          if not match:
              raise SystemExit('G11_ALIAS_ANCHOR_NOT_FOUND')
          text = text[:match.end()] + alias + text[match.end():]
          package.write_text(text, encoding='utf-8', newline='\n')

          Path('.github/workflows/g12-atomic-create-sync-state.yml').unlink()
      - name: Scope and tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node scripts/guards/verify-lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.cjs
          npx tsc --noEmit -p tsconfig.g12.json
          node --test tests/lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.test.cjs
          npm run build
      - name: Commit and push G12
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/g12-atomic-create-sync-state.yml \
            src/lib/google-calendar-create-sync-state-insert-payload.ts \
            scripts/guards/verify-lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.cjs \
            tests/lf-prod-sot-g12-gcal-create-atomic-sync-state-insert-payload-contract.test.cjs \
            _project/runs/LF-PROD-SOT-G12_GCAL_CREATE_ATOMIC_SYNC_STATE_INSERT_PAYLOAD_CONTRACT.md \
            tsconfig.g12.json package.json
          git diff --cached --check
          git commit -m 'feat(sot): add atomic create sync-state insert payload contract'
          git push origin HEAD:dev-rollout-freeze
