name: G15-R14 Stage07 Cases guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused G15-R14 tests
        run: node --test tests/lf-prod-sot-g15-r14-stage07-cases-guard.test.cjs

      - name: Reconciled Stage07 Cases guard
        run: node scripts/check-visual-stage07-cases.cjs

      - name: Production build
        run: npm run build
