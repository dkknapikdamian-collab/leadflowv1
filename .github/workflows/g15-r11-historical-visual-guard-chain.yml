name: G15-R11 historical visual guard chain reconciliation
# Exact-SHA gate: all reconciled guards and build are blocking.

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Stage16 Today guard
        run: node scripts/check-visual-stage16-today-html-reset.cjs

      - name: V14 theme guard
        run: node scripts/check-visual-html-theme-v14.cjs

      - name: Stage08 CaseDetail guard
        run: node scripts/check-visual-stage08-case-detail.cjs

      - name: Stage07 Cases guard
        run: node scripts/check-visual-stage07-cases.cjs

      - name: Stage06 ClientDetail guard
        run: node scripts/check-visual-stage06-client-detail.cjs

      - name: Stage05 Clients unchanged guard
        run: node scripts/check-visual-stage05-clients.cjs

      - name: Stage04 LeadDetail guard
        run: node scripts/check-visual-stage04-lead-detail.cjs

      - name: Stage03 Leads guard
        run: node scripts/check-visual-stage03-leads.cjs

      - name: Stage02 Today guard
        run: node scripts/check-visual-stage02-today.cjs

      - name: Stage01 shell guard
        run: node scripts/check-visual-stage01-shell.cjs

      - name: Production build
        run: npm run build
