name: G15-R13 Stage08 CaseDetail guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r13:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused G15-R13 tests
        run: node --test tests/lf-prod-sot-g15-r13-stage08-case-detail-guard.test.cjs

      - name: Reconciled Stage08 CaseDetail guard
        run: node scripts/check-visual-stage08-case-detail.cjs

      - name: Production build
        run: npm run build
