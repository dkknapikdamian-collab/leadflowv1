name: G15-R23H client-finance summary currency contract repair

on:
  pull_request:
    branches:
      - dev-rollout-freeze

permissions:
  contents: read

jobs:
  verify-g15-r23h:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install diagnostic React 19 type foundation
        run: npm install --no-save --package-lock=false @types/react@19.2.17 @types/react-dom@19.2.3

      - name: Prove dependency manifests unchanged
        run: git diff --exit-code "origin/${GITHUB_BASE_REF}...HEAD" -- package.json package-lock.json

      - name: Focused R23H tests
        run: node --test tests/lf-prod-sot-g15-r23h-client-finance-summary-currency.test.cjs

      - name: R23H client-finance currency guard
        run: node scripts/check-g15-r23h-client-finance-summary-currency.cjs

      - name: R23A active TypeScript scope guard
        run: node scripts/check-g15-r23a-tsc-active-scope.cjs

      - name: Map active TypeScript debt after R23H
        run: node scripts/diagnostics/map-g15-r23a-active-tsc-debt.cjs

      - name: Verify exact R23H debt delta and next first error
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('_project/artifacts/g15-r23a-active-tsc/summary.json', 'utf8'));
          const log = fs.readFileSync('_project/artifacts/g15-r23a-active-tsc/tsc.log', 'utf8');
          const expectedFirstError = {
            file: 'src/components/finance/FinanceSnapshot.tsx',
            line: 4,
            column: 15,
            code: 'TS2305',
          };
          if (summary.status !== 'ACTIVE_TYPE_DEBT_IDENTIFIED') throw new Error(`UNEXPECTED_STATUS=${summary.status}`);
          if (summary.errorCount !== 54) throw new Error(`EXPECTED_54_ACTIVE_ERRORS_GOT_${summary.errorCount}`);
          if (summary.globalErrorCount !== 0) throw new Error(`GLOBAL_ERRORS=${summary.globalErrorCount}`);
          if (summary.nonActiveErrorCount !== 0) throw new Error(`NON_ACTIVE_ERRORS=${summary.nonActiveErrorCount}`);
          for (const [key, value] of Object.entries(expectedFirstError)) {
            if (summary.firstError?.[key] !== value) throw new Error(`UNEXPECTED_FIRST_ERROR_${key}=${summary.firstError?.[key]}`);
          }
          if (/FinanceMiniSummary\.tsx\(265,22\).*TS2339/.test(log)) throw new Error('R23H_FIRST_TARGET_ERROR_REMAINS');
          if (/FinanceMiniSummary\.tsx\(266,68\).*TS2339/.test(log)) throw new Error('R23H_SECOND_TARGET_ERROR_REMAINS');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Verify exact changed-file allowlist
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/g15-r23h-client-finance-summary-currency.yml
          _project/runs/LF-PROD-SOT-G15-R23H_CLIENT_FINANCE_SUMMARY_CURRENCY_CONTRACT_REPAIR.md
          scripts/check-g15-r23h-client-finance-summary-currency.cjs
          src/lib/client-finance.ts
          src/lib/finance/case-finance-source.ts
          tests/lf-prod-sot-g15-r23h-client-finance-summary-currency.test.cjs
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Upload R23H TypeScript debt delta evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g15-r23h-active-tsc-debt-delta
          path: _project/artifacts/g15-r23a-active-tsc/
          if-no-files-found: error
          retention-days: 30

      - name: Production build
        run: npm run build
