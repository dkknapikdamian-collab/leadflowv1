name: R23 ClientDetail modal contract
on:
  pull_request:
    branches: [dev-rollout-freeze]
    paths: [.github/workflows/r23-client-detail-modal-contract.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'g15-r23-scope-tsc-to-active-product'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g15-r23-scope-tsc-to-active-product
          fetch-depth: 0
      - name: Wire current missing-item modal contract
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/ClientDetail.tsx'); t=p.read_text(encoding='utf-8-sig')
          def one(a,b,label):
            global t
            n=t.count(a); print(label,n)
            if n!=1: raise SystemExit(f'{label}: {n}')
            t=t.replace(a,b,1)
          one("import { buildMissingItemModalDraft } from '../lib/missing-items/stage227c2-missing-item-modal-contract';","import { buildMissingItemModalDraft, type MissingItemKind } from '../lib/missing-items/stage227c2-missing-item-modal-contract';",'import')
          one("  const [clientMissingNote, setClientMissingNote] = useState('');\n  const [clientMissingBlocksProgress, setClientMissingBlocksProgress] = useState(false);","  const [clientMissingNote, setClientMissingNote] = useState('');\n  const [clientMissingKind, setClientMissingKind] = useState<MissingItemKind>('document');\n  const [clientMissingBlocksProgress, setClientMissingBlocksProgress] = useState(false);\n  const [clientMissingBlockScope, setClientMissingBlockScope] = useState('');",'state')
          one("          title: clientMissingTitle,\n          note: clientMissingNote,","          title: clientMissingTitle,\n          note: clientMissingNote,\n          missingKind: clientMissingKind,\n          blocksProgress: clientMissingBlocksProgress,\n          blockScope: clientMissingBlockScope,",'draft')
          one("  }, [client, clientId, clientMissingBlocksProgress, clientMissingNote, clientMissingTitle, hasAccess, reload, workspace?.id]);","  }, [client, clientId, clientMissingBlockScope, clientMissingBlocksProgress, clientMissingKind, clientMissingNote, clientMissingTitle, hasAccess, reload, workspace?.id]);",'deps')
          one("                titleValue={clientMissingTitle}\n                noteValue={clientMissingNote}\n                error={clientMissingError}","                titleValue={clientMissingTitle}\n                noteValue={clientMissingNote}\n                missingKindValue={clientMissingKind}\n                blocksProgressValue={clientMissingBlocksProgress}\n                blockScopeValue={clientMissingBlockScope}\n                error={clientMissingError}",'values')
          one("                onNoteChange={setClientMissingNote}\n                onCancel={() => {","                onNoteChange={setClientMissingNote}\n                onMissingKindChange={setClientMissingKind}\n                onBlocksProgressChange={setClientMissingBlocksProgress}\n                onBlockScopeChange={setClientMissingBlockScope}\n                onCancel={() => {",'handlers')
          one("                  setClientMissingTitle('');\n                  setClientMissingNote('');\n                  setClientMissingError('');","                  setClientMissingTitle('');\n                  setClientMissingNote('');\n                  setClientMissingKind('document');\n                  setClientMissingBlocksProgress(false);\n                  setClientMissingBlockScope('');\n                  setClientMissingError('');",'cancel')
          p.write_text(t,encoding='utf-8'); Path('.github/workflows/r23-client-detail-modal-contract.yml').unlink()
      - name: Validate
        run: |
          git diff --check
          npm ci
          npm install --no-save --package-lock=false @types/react@19.2.17 @types/react-dom@19.2.3
          node scripts/check-g15-r23-tsc-active-product-scope.cjs
          npx tsc --noEmit --pretty false > r23-client-modal-tsc.log 2>&1 || true
          npm run build
          cat r23-client-modal-tsc.log
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/ClientDetail.tsx .github/workflows/r23-client-detail-modal-contract.yml
          git commit -m "fix(closeflow): wire ClientDetail missing-item modal contract"
          git push origin HEAD:g15-r23-scope-tsc-to-active-product
