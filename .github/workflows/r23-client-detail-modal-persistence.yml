name: R23 ClientDetail modal persistence
on:
  pull_request:
    branches: [dev-rollout-freeze]
    paths: [.github/workflows/r23-client-detail-modal-persistence.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'g15-r23-scope-tsc-to-active-product'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g15-r23-scope-tsc-to-active-product
          fetch-depth: 0
      - name: Persist current missing-item semantics
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/ClientDetail.tsx'); t=p.read_text(encoding='utf-8-sig')
          def one(a,b,label):
            global t
            n=t.count(a); print(label,n)
            if n!=1: raise SystemExit(f'{label}: {n}')
            t=t.replace(a,b,1)
          one("      setClientMissingTitle('');\n      setClientMissingNote('');\n      setClientMissingError('');","      setClientMissingTitle('');\n      setClientMissingNote('');\n      setClientMissingKind('document');\n      setClientMissingBlocksProgress(false);\n      setClientMissingBlockScope('');\n      setClientMissingError('');",'success reset')
          marker="          missingItem: true,\n          blocksProgress: clientMissingBlocksProgress,"
          replacement="          missingItem: true,\n          missingKind: draft.missingKind,\n          blockScope: draft.blockScope,\n          blocksProgress: clientMissingBlocksProgress,"
          n=t.count(marker); print('payload markers',n)
          if n<2: raise SystemExit(f'payload markers: {n}')
          t=t.replace(marker,replacement)
          props='                  variant="outline"\n                  size="sm"\n'
          n=t.count(props); print('unsupported props',n)
          if n!=2: raise SystemExit(f'unsupported props: {n}')
          t=t.replace(props,'')
          p.write_text(t,encoding='utf-8'); Path('.github/workflows/r23-client-detail-modal-persistence.yml').unlink()
      - name: Validate
        run: |
          git diff --check
          npm ci
          npm install --no-save --package-lock=false @types/react@19.2.17 @types/react-dom@19.2.3
          node scripts/check-g15-r23-tsc-active-product-scope.cjs
          npx tsc --noEmit --pretty false > r23-client-persistence-tsc.log 2>&1 || true
          npm run build
          cat r23-client-persistence-tsc.log
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/ClientDetail.tsx .github/workflows/r23-client-detail-modal-persistence.yml
          git commit -m "fix(closeflow): persist ClientDetail missing-item semantics"
          git push origin HEAD:g15-r23-scope-tsc-to-active-product
