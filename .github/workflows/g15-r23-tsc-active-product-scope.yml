name: G15-R23 TypeScript active product scope

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r23:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Diagnostic React 19 type foundation
        run: npm install --no-save --package-lock=false @types/react@19.2.17 @types/react-dom@19.2.3
      - name: Focused G15-R23 scope tests
        run: node --test tests/lf-prod-sot-g15-r23-tsc-active-product-scope.test.cjs
      - name: Focused G15-R23 finance runtime tests
        run: npx tsx --test tests/lf-prod-sot-g15-r23-finance-runtime-semantics.test.ts
      - name: TypeScript scope guard
        run: node scripts/check-g15-r23-tsc-active-product-scope.cjs
      - name: Active product typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit --pretty false > r23-active-tsc.log 2>&1
      - name: Upload active typecheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g15-r23-active-typecheck
          path: r23-active-tsc.log
          if-no-files-found: error
      - name: Production build
        run: npm run build
      - name: Enforce active typecheck
        if: steps.typecheck.outcome != 'success'
        run: |
          cat r23-active-tsc.log
          exit 1
