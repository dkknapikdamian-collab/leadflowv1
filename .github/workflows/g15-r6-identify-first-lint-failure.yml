name: G15-R6 identify first lint failure

on:
  push:
    branches:
      - g15-r6-identify-first-lint-failure
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify diagnostic runner
        run: node --test tests/lf-prod-sot-g15-r6-identify-next-real-lint-chain-failure.test.cjs
      - name: Identify first non-zero lint command
        run: node scripts/diagnose-lint-chain-first-failure.cjs
        env:
          G15_R6_OUTPUT_DIR: ${{ runner.temp }}/g15-r6-lint-diagnostic
      - name: Upload full diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: g15-r6-lint-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/g15-r6-lint-diagnostic
          if-no-files-found: error
          retention-days: 30
      - name: Publish bounded evidence to pull request
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAGNOSTIC_JSON: ${{ runner.temp }}/g15-r6-lint-diagnostic/diagnostic.json
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import urllib.request

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as handle:
              event = json.load(handle)
          with open(os.environ['DIAGNOSTIC_JSON'], encoding='utf-8') as handle:
              diagnostic = json.load(handle)

          pull = event['pull_request']
          current_body = pull.get('body') or ''
          marker_start = '<!-- G15_R6_DIAGNOSTIC_START -->'
          marker_end = '<!-- G15_R6_DIAGNOSTIC_END -->'
          current_body = re.sub(
              re.escape(marker_start) + r'.*?' + re.escape(marker_end),
              '',
              current_body,
              flags=re.S,
          ).rstrip()

          failure = diagnostic.get('firstNonzero')
          if failure:
              command = failure['command']
              exit_code = failure['exitCode']
              index = failure['index']
              tail = html.escape(failure.get('tail') or '')
              result_line = 'PASS_FIRST_NONZERO_IDENTIFIED'
          else:
              command = 'NONE'
              exit_code = 'NONE'
              index = 'NONE'
              tail = 'Lint chain completed without a non-zero command.'
              result_line = 'PASS_LINT_CHAIN_ALL_GREEN'

          evidence = f'''{marker_start}
          ## G15-R6 automated diagnostic evidence

          - result: `{result_line}`
          - commands total: `{diagnostic['commandsTotal']}`
          - commands passed before failure: `{diagnostic['commandsPassedBeforeFailure']}`
          - first non-zero index: `{index}`
          - first non-zero command: `{command}`
          - first non-zero exit code: `{exit_code}`
          - workflow run: `{os.environ['GITHUB_RUN_ID']}`
          - full artifact: `g15-r6-lint-diagnostic-{os.environ['GITHUB_SHA']}`

          <details><summary>First non-zero tail</summary><pre>{tail}</pre></details>
          {marker_end}'''

          new_body = f'{current_body}\n\n{evidence}\n'
          request = urllib.request.Request(
              pull['url'],
              data=json.dumps({'body': new_body}).encode('utf-8'),
              method='PATCH',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise SystemExit(f'PR_UPDATE_FAILED:{response.status}')
          print('G15_R6_PR_EVIDENCE_PUBLISHED=YES')
          PY
