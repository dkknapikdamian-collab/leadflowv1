name: G15-R6 identify first lint failure

on:
  push:
    branches:
      - g15-r6-identify-first-lint-failure
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify diagnostic runner
        run: node --test tests/lf-prod-sot-g15-r6-identify-next-real-lint-chain-failure.test.cjs
      - name: Identify first non-zero lint command
        run: node scripts/diagnose-lint-chain-first-failure.cjs
        env:
          G15_R6_OUTPUT_DIR: ${{ runner.temp }}/g15-r6-lint-diagnostic
      - name: Upload full diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: g15-r6-lint-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/g15-r6-lint-diagnostic
          if-no-files-found: error
          retention-days: 30
      - name: Persist bounded diagnostic summary
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          destination='_project/runs/artifacts/LF-PROD-SOT-G15-R6'
          mkdir -p "$destination"
          cp '${{ runner.temp }}/g15-r6-lint-diagnostic/diagnostic.json' "$destination/diagnostic.json"
          cp '${{ runner.temp }}/g15-r6-lint-diagnostic/diagnostic.txt' "$destination/diagnostic.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$destination/diagnostic.json" "$destination/diagnostic.txt"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'G15_R6_DIAGNOSTIC_SUMMARY_ALREADY_CURRENT=YES'
            exit 0
          fi
          git commit -m 'test(closeflow): persist G15-R6 lint diagnostic evidence'
          git push origin HEAD:g15-r6-identify-first-lint-failure
