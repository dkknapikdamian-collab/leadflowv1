name: R23 apply active type batch one

on:
  pull_request:
    branches:
      - dev-rollout-freeze
    paths:
      - .github/workflows/r23-apply-active-type-patches.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'g15-r23-scope-tsc-to-active-product'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R23 branch
        uses: actions/checkout@v4
        with:
          ref: g15-r23-scope-tsc-to-active-product
          fetch-depth: 0
      - name: Apply exact type repairs
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8-sig')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              print(f'PATCH {path}: literal matches={count}: {old[:70]!r}')
              if count != 1: raise SystemExit(f'{path}: expected one match, found {count}')
              write(path, text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              print(f'PATCH {path}: literal matches={count}: {old[:70]!r}')
              if count != expected: raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              write(path, text.replace(old, new))

          def regex_replace(path, pattern, replacement, expected=1):
              text = read(path)
              next_text, count = re.subn(pattern, replacement, text, flags=re.MULTILINE)
              print(f'PATCH {path}: regex matches={count}: {pattern[:90]!r}')
              if count != expected: raise SystemExit(f'{path}: expected {expected} regex matches, found {count}')
              write(path, next_text)

          replace_count('api/leads.ts', "if (!shouldDropMissingColumnForLeadFallback('leads', missingColumn, currentPayload)) throw error;", "if (!missingColumn || !shouldDropMissingColumnForLeadFallback('leads', missingColumn, currentPayload)) throw error;", 2)
          replace_once('api/leads.ts', "if (!shouldDropMissingColumnForLeadFallback('cases', missingColumn, currentPayload)) throw error;", "if (!missingColumn || !shouldDropMissingColumnForLeadFallback('cases', missingColumn, currentPayload)) throw error;")
          replace_once('api/leads.ts', "if (!shouldDropMissingColumnForLeadFallback('activities', missingColumn, currentPayload)) throw error;", "if (!missingColumn || !shouldDropMissingColumnForLeadFallback('activities', missingColumn, currentPayload)) throw error;")
          regex_replace('api/system.ts', r'userId: identity\.userId,\s*\n\s*email: identity\.email,\s*\n\s*fullName: identity\.fullName,', 'userId: identity.userId || undefined,\n      email: identity.email || undefined,\n      fullName: identity.fullName || undefined,')
          regex_replace('src/server/ai-next-action.ts', r'if \(overdueTask\) \{\s*\n\s*const dueAt = addHours\(now, 1\);', 'if (overdueTask?.dueAt) {\n    const overdueDueAt = overdueTask.dueAt;\n    const dueAt = addHours(now, 1);')
          replace_once('src/server/ai-next-action.ts', 'reason: `Zadanie miało termin ${formatMoment(overdueTask.dueAt.toISOString())}.`,', 'reason: `Zadanie miało termin ${formatMoment(overdueDueAt.toISOString())}.`,')

          for path in ['src/lib/page-header-content.ts', 'src/components/CloseFlowPageHeaderV2.tsx']:
              regex_replace(path, r"(\s+leads:\s*\{\s*\n)(\s+title: 'Leady',)", r"\1    kicker: 'SPRZEDAŻ',\n\2")

          replace_once('src/components/ContextActionDialogs.tsx', "import { type MouseEvent, useEffect, useMemo, useState } from 'react';", "import { useEffect, useMemo, useState } from 'react';")
          replace_once('src/components/ContextActionDialogs.tsx', 'const capture = (event: MouseEvent) => {', 'const capture = (event: globalThis.MouseEvent) => {')
          replace_once('src/components/ContextActionDialogs.tsx', "source: request.recordType === 'client' ? 'STAGE232I2_CONTEXT_ACTION_CLIENT_MISSING_ITEM_SOURCE' : 'context_action_dialogs_blocker',", "source: 'context_action_dialogs_blocker',")
          replace_once('src/components/EventCreateDialog.tsx', 'onSaved?: () => void | Promise<void>;', 'onSaved?: (createdEvent?: unknown) => void | Promise<void>;')
          replace_once('src/components/TaskCreateDialog.tsx', 'onSaved?: () => void | Promise<void>;', 'onSaved?: (createdTask?: unknown) => void | Promise<void>;')
          replace_once('src/components/finance/CaseFinanceEditorDialog.tsx', "import { normalizeCommissionMode, normalizeCurrency } from '../../lib/finance/finance-normalize';", "import { normalizeCommissionMode, normalizeCommissionStatus, normalizeCurrency } from '../../lib/finance/finance-normalize';")
          replace_once('src/components/ui-system/icon-registry.ts', 'const RemoveIcon = (Lucide as Record<string, LucideIcon>)[removeIconKey] || X;', 'const RemoveIcon = (Lucide as unknown as Record<string, LucideIcon>)[removeIconKey] || X;')
          replace_once('src/lib/client-finance.ts', '  commissionRemainingAmount?: number;\n};', '  commissionRemainingAmount?: number;\n  currency: string;\n};')
          replace_once('src/lib/supabase-fallback.ts', 'export async function fetchPaymentsFromSupabase(params?: { leadId?: string; caseId?: string; clientId?: string; status?: string }) {', 'export async function fetchPaymentsFromSupabase(params?: { leadId?: string; caseId?: string; clientId?: string; status?: string; includeArchived?: boolean }) {')
          replace_once('src/lib/closeflow-runtime-source-truth.ts', 'export function buildRuntimeAccessPlanTruth(input = {}) {', '/** @param {{ planId?: unknown, subscriptionStatus?: unknown }} input */\nexport function buildRuntimeAccessPlanTruth(input = {}) {')

          ft = read('src/lib/finance/finance-types.ts')
          changes = [
              ('export type NormalizedFinancePayment = {\n  id?: string;', 'export type NormalizedFinancePayment = {\n  id?: string;\n  workspaceId?: string;\n  leadId?: string | null;\n  clientId?: string | null;\n  caseId?: string | null;\n  createdAt?: string | null;\n  updatedAt?: string | null;'),
              ('export type FinanceCommissionConfig = {', 'export type FinanceRelationRef = {\n  workspaceId?: string;\n  leadId?: string | null;\n  clientId?: string | null;\n  caseId?: string | null;\n};\n\nexport type FinanceCommissionConfig = {'),
              ('  paidAmount?: number | string | null;\n  currency?:', '  paidAmount?: number | string | null;\n  remainingAmount?: number | string | null;\n  currency?:'),
              ('export type FinanceSummary = FinanceSnapshot & {\n  paidCommissionAmount:', 'export type FinanceSummary = FinanceSnapshot & {\n  plannedAmount?: number;\n  paidCommissionAmount:'),
              ('export const CLOSEFLOW_FINANCE_DOMAIN_CONTRACT_NOTE = {', 'export type CommissionConfig = FinanceCommissionConfig;\n\nexport const CLOSEFLOW_FINANCE_DOMAIN_CONTRACT_NOTE = {'),
          ]
          for old, new in changes:
              count = ft.count(old)
              print(f'PATCH finance-types: matches={count}: {old[:70]!r}')
              if count != 1: raise SystemExit(f'finance-types expected one match, found {count}')
              ft = ft.replace(old, new, 1)
          write('src/lib/finance/finance-types.ts', ft)

          mutation = read('src/lib/work-items/no-flicker-mutation.ts')
          old = '  record?: unknown;\n  source?: string;\n  occurredAt?: string;\n};'
          new = '  record?: unknown;\n  item?: unknown;\n  recordType?: string | null;\n  recordId?: string | null;\n  leadId?: string | null;\n  clientId?: string | null;\n  caseId?: string | null;\n  displayKind?: string;\n  businessKind?: string;\n  source?: string;\n  occurredAt?: string;\n};'
          count = mutation.count(old)
          print(f'PATCH no-flicker base: matches={count}')
          if count != 1: raise SystemExit(f'no-flicker expected one base shape, found {count}')
          write('src/lib/work-items/no-flicker-mutation.ts', mutation.replace(old, new, 1))

          Path('.github/workflows/r23-apply-active-type-patches.yml').unlink()
      - name: Validate batch
        run: |
          git diff --check
          npm ci
          npm install --no-save --package-lock=false @types/react@19.2.17 @types/react-dom@19.2.3
          node scripts/check-g15-r23-tsc-active-product-scope.cjs
          npx tsc --noEmit --pretty false > r23-batch-one-tsc.log 2>&1 || true
          npm run build
          cat r23-batch-one-tsc.log
      - name: Commit batch and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/leads.ts api/system.ts src/server/ai-next-action.ts src/lib/page-header-content.ts src/components/CloseFlowPageHeaderV2.tsx src/components/ContextActionDialogs.tsx src/components/EventCreateDialog.tsx src/components/TaskCreateDialog.tsx src/components/finance/CaseFinanceEditorDialog.tsx src/components/ui-system/icon-registry.ts src/lib/client-finance.ts src/lib/supabase-fallback.ts src/lib/closeflow-runtime-source-truth.ts src/lib/finance/finance-types.ts src/lib/work-items/no-flicker-mutation.ts .github/workflows/r23-apply-active-type-patches.yml
          git commit -m "fix(closeflow): apply first active TypeScript repair batch"
          git push origin HEAD:g15-r23-scope-tsc-to-active-product
