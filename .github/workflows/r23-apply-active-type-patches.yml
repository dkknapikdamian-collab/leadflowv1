name: R23 apply active type patches

on:
  push:
    branches:
      - g15-r23-scope-tsc-to-active-product
    paths:
      - .github/workflows/r23-apply-active-type-patches.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci(closeflow): run R23 active type patcher'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: g15-r23-scope-tsc-to-active-product
          fetch-depth: 0
      - name: Apply narrow type repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          leads = Path('api/leads.ts')
          text = leads.read_text(encoding='utf-8-sig')
          replacements = [
              ("if (!shouldDropMissingColumnForLeadFallback('leads', missingColumn, currentPayload)) throw error;", "if (!missingColumn || !shouldDropMissingColumnForLeadFallback('leads', missingColumn, currentPayload)) throw error;"),
              ("if (!shouldDropMissingColumnForLeadFallback('cases', missingColumn, currentPayload)) throw error;", "if (!missingColumn || !shouldDropMissingColumnForLeadFallback('cases', missingColumn, currentPayload)) throw error;"),
              ("if (!shouldDropMissingColumnForLeadFallback('activities', missingColumn, currentPayload)) throw error;", "if (!missingColumn || !shouldDropMissingColumnForLeadFallback('activities', missingColumn, currentPayload)) throw error;"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if old.startswith("if (!shouldDropMissingColumnForLeadFallback('leads'"):
                  if count != 2:
                      raise SystemExit(f'api/leads.ts: expected two leads fallback matches, found {count}')
                  text = text.replace(old, new)
              else:
                  if count != 1:
                      raise SystemExit(f'api/leads.ts: expected one fallback match, found {count}: {old}')
                  text = text.replace(old, new, 1)
          leads.write_text(text, encoding='utf-8')

          replace_once(
              'api/system.ts',
              """    const row = await ensureProfileRow({
              userId: identity.userId,
              email: identity.email,
              fullName: identity.fullName,
              workspaceId,
            });""",
              """    const row = await ensureProfileRow({
              userId: identity.userId || undefined,
              email: identity.email || undefined,
              fullName: identity.fullName || undefined,
              workspaceId,
            });""",
          )

          replace_once(
              'src/server/ai-next-action.ts',
              """  const overdueTask = openTasks.find((task) => task.dueAt && task.dueAt.getTime() < now.getTime());
            if (overdueTask) {
              const dueAt = addHours(now, 1);""",
              """  const overdueTask = openTasks.find((task) => task.dueAt && task.dueAt.getTime() < now.getTime());
            if (overdueTask?.dueAt) {
              const overdueDueAt = overdueTask.dueAt;
              const dueAt = addHours(now, 1);""",
          )
          replace_once(
              'src/server/ai-next-action.ts',
              "reason: `Zadanie miało termin ${formatMoment(overdueTask.dueAt.toISOString())}.`,",
              "reason: `Zadanie miało termin ${formatMoment(overdueDueAt.toISOString())}.`,",
          )
      - name: Verify patch diff
        run: |
          git diff --check
          git diff -- api/leads.ts api/system.ts src/server/ai-next-action.ts
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/leads.ts api/system.ts src/server/ai-next-action.ts
          git commit -m "fix(closeflow): repair active API nullability types"
          git push origin HEAD:g15-r23-scope-tsc-to-active-product
