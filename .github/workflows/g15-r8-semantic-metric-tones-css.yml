name: G15-R8 semantic metric tones CSS integration

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused G15-R8 tests
        run: node --test tests/lf-prod-sot-g15-r8-semantic-metric-tones-css-import.test.cjs

      - name: Semantic metric tones guard
        run: npm run check:vs7-semantic-metric-tones

      - name: Production build
        run: npm run build
