name: G15-R17 Stage03 Leads guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r17:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Focused G15-R17 tests
        run: node --test tests/lf-prod-sot-g15-r17-stage03-leads-guard.test.cjs
      - name: Reconciled Stage03 Leads guard
        run: node scripts/check-visual-stage03-leads.cjs
      - name: Production build
        run: npm run build
