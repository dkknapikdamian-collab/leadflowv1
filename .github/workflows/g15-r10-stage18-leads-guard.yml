name: G15-R10 Stage18 Leads guard reconciliation

on:
  pull_request:
    branches:
      - dev-rollout-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g15-r10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused G15-R10 tests
        run: node --test tests/lf-prod-sot-g15-r10-stage18-leads-guard.test.cjs

      - name: Reconciled Stage18 Leads guard
        run: node scripts/check-visual-stage18-leads-hard-1to1.cjs

      - name: Production build
        run: npm run build
